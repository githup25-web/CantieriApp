# ============================================
# CantieriApp — Docker Compose (Produzione)
# ============================================

version: "3.8"

services:
  # --- MongoDB ---
  mongodb:
    image: mongo:7
    container_name: cantieriapp-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: cantieriapp
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - cantieriapp-net

  # --- MinIO (S3-compatible storage) ---
  minio:
    image: minio/minio:latest
    container_name: cantieriapp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio-access-key
      MINIO_ROOT_PASSWORD: minio-secret-key
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - cantieriapp-net

  # --- Backend API ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cantieriapp-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MINIO_ENDPOINT: minio:9000
    depends_on:
      - mongodb
      - minio
    ports:
      - "8000:8000"
    networks:
      - cantieriapp-net

  # --- Nginx (Reverse Proxy) ---
  nginx:
    image: nginx:alpine
    container_name: cantieriapp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - cantieriapp-net

volumes:
  mongo_data:
  minio_data:

networks:
  cantieriapp-net:
    driver: bridge
